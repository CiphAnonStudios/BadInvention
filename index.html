<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
>

<title>Bad Invention</title>

<!-- Matter.js physics -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;

    overflow:hidden;

    background:#101318;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   GAME
========================================================= */

#game{
    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:#17202a;
}

#canvas{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    display:block;
}


/* =========================================================
   TOP BAR
========================================================= */

#topbar{

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:64px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:
        0 18px;

    background:
        linear-gradient(
            180deg,
            rgba(8,9,12,.98),
            rgba(13,15,19,.94)
        );

    border-bottom:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 4px 20px rgba(0,0,0,.3);

    z-index:50;
}


/* =========================================================
   LOGO
========================================================= */

#logo{

    display:flex;

    align-items:center;

    gap:8px;

    color:#fff;

    font-size:21px;

    font-weight:900;

    letter-spacing:.5px;
}

#logoIcon{
    font-size:25px;
}

#version{

    padding:
        3px 6px;

    border-radius:5px;

    background:#282f39;

    color:#8e99a7;

    font-size:9px;

    font-weight:bold;
}


/* =========================================================
   COINS
========================================================= */

#coinBox{

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        7px 12px;

    border-radius:10px;

    background:#202630;

    border:
        1px solid #353d49;
}

#coinIcon{
    font-size:17px;
}

#coins{

    color:#ffd43b;

    font-size:15px;

    font-weight:900;
}


/* =========================================================
   GOAL PANEL
========================================================= */

#challenge{

    position:absolute;

    top:78px;
    left:50%;

    transform:
        translateX(-50%);

    min-width:230px;

    padding:
        9px 17px;

    text-align:center;

    border-radius:10px;

    background:
        rgba(10,12,15,.9);

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);

    color:#fff;

    font-size:12px;

    font-weight:800;

    z-index:40;
}


/* =========================================================
   MODE INDICATOR
========================================================= */

#mode{

    position:absolute;

    top:78px;
    left:14px;

    padding:
        7px 10px;

    border-radius:8px;

    background:
        rgba(0,0,0,.55);

    color:#aeb7c3;

    font-size:10px;

    font-weight:bold;

    z-index:40;
}

#mode.build{
    color:#7dd3fc;
}

#mode.running{
    color:#86efac;
}


/* =========================================================
   RIGHT CONTROL PANEL
========================================================= */

#controls{

    position:absolute;

    right:14px;

    bottom:126px;

    display:flex;

    flex-direction:column;

    gap:7px;

    z-index:40;
}

.controlButton{

    min-width:112px;

    padding:
        10px 13px;

    border:none;

    border-radius:9px;

    color:#fff;

    background:#29313c;

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 3px 0 #0a0b0d;

    font-size:11px;

    font-weight:900;

    cursor:pointer;

    transition:
        transform .08s,
        filter .1s;
}

.controlButton:hover{
    filter:brightness(1.15);
}

.controlButton:active{

    transform:
        translateY(2px);

    box-shadow:
        0 1px 0 #0a0b0d;
}

#start{
    background:#218c40;
}

#clear{
    background:#9f2923;
}

#goal{
    background:#3b536c;
}

#shop{
    background:#5c43ce;
}


/* =========================================================
   HELP
========================================================= */

#help{

    position:absolute;

    left:14px;

    bottom:127px;

    max-width:250px;

    padding:
        8px 11px;

    border-radius:8px;

    background:
        rgba(0,0,0,.48);

    color:#8e98a5;

    font-size:10px;

    line-height:1.4;

    z-index:30;
}


/* =========================================================
   PART TRAY
========================================================= */

#partsTray{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:108px;

    padding:
        9px 10px;

    display:flex;

    align-items:center;

    gap:8px;

    overflow-x:auto;

    overflow-y:hidden;

    background:
        linear-gradient(
            180deg,
            rgba(13,15,19,.94),
            rgba(7,8,10,.99)
        );

    border-top:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 -5px 25px rgba(0,0,0,.35);

    z-index:50;
}

#partsTray::-webkit-scrollbar{
    height:4px;
}

#partsTray::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:5px;
}


/* =========================================================
   PART BUTTON
========================================================= */

.partButton{

    position:relative;

    width:76px;
    min-width:76px;

    height:89px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:2px;

    border-radius:10px;

    background:#20262f;

    border:
        1px solid #39424e;

    color:white;

    cursor:pointer;

    transition:
        transform .08s,
        background .1s,
        border-color .1s;
}

.partButton:hover{

    background:#29313c;

    border-color:#667384;
}

.partButton:active{

    transform:
        scale(.94);
}

.partButton img{

    width:49px;
    height:49px;

    object-fit:contain;

    pointer-events:none;
}

.partName{

    max-width:68px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    color:#dce2e8;

    font-size:9px;

    font-weight:800;
}

.partCost{

    position:absolute;

    top:4px;
    right:5px;

    color:#ffd43b;

    font-size:8px;

    font-weight:bold;
}

.locked{

    opacity:.38;
}


/* =========================================================
   POPUP
========================================================= */

#popup{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:
        min(430px,90vw);

    max-height:80vh;

    overflow:auto;

    padding:25px;

    border-radius:18px;

    background:
        rgba(10,12,15,.98);

    border:
        1px solid #4a535e;

    box-shadow:
        0 20px 70px rgba(0,0,0,.6);

    color:white;

    text-align:center;

    z-index:100;

    display:none;
}

#popupTitle{

    margin-bottom:12px;

    font-size:23px;
}

#popupContent{

    color:#aeb7c2;

    font-size:13px;

    line-height:1.6;
}

#popupButton{

    margin-top:18px;

    padding:
        10px 18px;

    border:none;

    border-radius:9px;

    background:#f28c18;

    color:white;

    font-weight:900;

    cursor:pointer;
}


/* =========================================================
   SHOP
========================================================= */

.shopRow{

    display:flex;

    align-items:center;

    gap:10px;

    margin:
        6px 0;

    padding:7px 9px;

    border-radius:9px;

    background:#20262e;

    color:#fff;
}

.shopRow img{

    width:38px;
    height:38px;

    object-fit:contain;
}

.shopName{

    flex:1;

    text-align:left;

    font-weight:bold;

    font-size:12px;
}

.shopPrice{

    color:#ffd43b;

    font-size:11px;

    font-weight:bold;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    #topbar{
        height:58px;

        padding:
            0 10px;
    }

    #logo{
        font-size:16px;
    }

    #logoIcon{
        font-size:19px;
    }

    #coinBox{
        padding:
            6px 9px;
    }

    #challenge{

        top:69px;

        min-width:190px;

        padding:
            8px 11px;

        font-size:10px;
    }

    #mode{
        top:69px;
        left:8px;
        font-size:9px;
    }

    #controls{

        right:7px;

        bottom:115px;
    }

    .controlButton{

        min-width:94px;

        padding:
            8px 9px;

        font-size:9px;
    }

    #help{
        display:none;
    }

    #partsTray{
        height:103px;
    }

    .partButton{
        width:71px;
        min-width:71px;
        height:84px;
    }

    .partButton img{
        width:45px;
        height:45px;
    }
}

</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div id="topbar">

        <div id="logo">

            <span id="logoIcon">💀</span>

            <span>
                BAD INVENTION
            </span>

            <span id="version">
                V2
            </span>

        </div>


        <div id="coinBox">

            <span id="coinIcon">
                🪙
            </span>

            <span id="coins">
                0
            </span>

        </div>

    </div>


    <!-- =====================================================
         GOAL
    ====================================================== -->

    <div id="challenge">
        🎯 REACH THE TARGET
    </div>


    <!-- =====================================================
         MODE
    ====================================================== -->

    <div id="mode" class="build">
        BUILD MODE
    </div>


    <!-- =====================================================
         HELP
    ====================================================== -->

    <div id="help">

        BUILD:
        drag parts together

        <br>

        R:
        rotate selected part

        <br>

        DELETE:
        remove selected part

    </div>


    <!-- =====================================================
         CONTROLS
    ====================================================== -->

    <div id="controls">

        <button
            id="start"
            class="controlButton"
        >
            ▶ START
        </button>

        <button
            id="clear"
            class="controlButton"
        >
            🗑 CLEAR
        </button>

        <button
            id="goal"
            class="controlButton"
        >
            🎲 NEW GOAL
        </button>

        <button
            id="shop"
            class="controlButton"
        >
            🛒 SHOP
        </button>

    </div>


    <!-- =====================================================
         PART TRAY
    ====================================================== -->

    <div id="partsTray"></div>


    <!-- =====================================================
         POPUP
    ====================================================== -->

    <div id="popup">

        <h1 id="popupTitle">
            TITLE
        </h1>

        <div id="popupContent">
            Content
        </div>

        <button id="popupButton">
            CONTINUE
        </button>

    </div>

</div>


<script>

/* =========================================================
   MATTER.JS
========================================================= */

const {
    Engine,
    World,
    Bodies,
    Body,
    Constraint,
    Composite,
    Events,
    Vector
} = Matter;


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resizeCanvas(){

    W = canvas.width =
        innerWidth;

    H = canvas.height =
        innerHeight;
}

resizeCanvas();


/* =========================================================
   IMAGE FILES
   THESE ARE THE EXACT FILE LOCATIONS
========================================================= */

const IMAGE_FILES = {

    block:
        "images/block.png",

    wheel:
        "images/wheel.png",

    rocket:
        "images/rocket.png",

    spring:
        "images/spring.png",

    fan:
        "images/fan.png",

    balloon:
        "images/balloon.png",

    bomb:
        "images/bomb.png",

    magnet:
        "images/magnet.png",

    target:
        "images/target.png",

    background:
        "images/background.png"
};


/* =========================================================
   LOAD IMAGES
========================================================= */

const images = {};

for(
    const name in IMAGE_FILES
){

    const image =
        new Image();

    image.src =
        IMAGE_FILES[name];

    image.onload = function(){

        images[name] =
            image;
    };

    image.onerror =
        function(){

            console.warn(
                "Missing image: " +
                IMAGE_FILES[name]
            );
        };
}


/* =========================================================
   PART DEFINITIONS
========================================================= */

const PARTS = {

    block:{

        name:"Block",

        image:"block",

        width:70,
        height:45,

        density:.0025,

        cost:0

    },


    wheel:{

        name:"Wheel",

        image:"wheel",

        width:48,
        height:48,

        radius:24,

        density:.002,

        cost:0,

        wheel:true

    },


    rocket:{

        name:"Rocket",

        image:"rocket",

        width:68,
        height:34,

        density:.0015,

        cost:25,

        rocket:true

    },


    spring:{

        name:"Spring",

        image:"spring",

        width:25,
        height:60,

        density:.001,

        cost:30,

        spring:true

    },


    fan:{

        name:"Fan",

        image:"fan",

        width:55,
        height:55,

        density:.001,

        cost:35,

        fan:true

    },


    balloon:{

        name:"Balloon",

        image:"balloon",

        width:48,
        height:58,

        density:.0005,

        cost:40,

        balloon:true

    },


    bomb:{

        name:"Bomb",

        image:"bomb",

        width:46,
        height:46,

        radius:23,

        density:.002,

        cost:100,

        bomb:true

    },


    magnet:{

        name:"Magnet",

        image:"magnet",

        width:55,
        height:38,

        density:.002,

        cost:150,

        magnet:true

    }

};


/* =========================================================
   SAVE DATA
========================================================= */

let save;

try{

    save =
        JSON.parse(
            localStorage.getItem(
                "badInventionSaveV2"
            )
        );

}catch{

    save=null;
}

if(!save){

    save={

        coins:0,

        wins:0,

        unlocked:[

            "block",
            "wheel",
            "rocket",
            "spring",
            "fan",
            "balloon"

        ]
    };
}


function saveGame(){

    localStorage.setItem(

        "badInventionSaveV2",

        JSON.stringify(save)

    );
}


function updateCoins(){

    document
        .getElementById("coins")
        .textContent =
        save.coins;
}


/* =========================================================
   PHYSICS ENGINE
========================================================= */

const engine =
    Engine.create();

engine.gravity.x=0;

engine.gravity.y=1;

engine.gravity.scale=.001;

const world =
    engine.world;


/* =========================================================
   WORLD VARIABLES
========================================================= */

let physicsBodies=[];

let constraints=[];

let buildParts=[];

let running=false;

let worldReady=false;

let cameraX=0;

let targetX=1400;

let elapsed=0;

let explodedBombs=
    new Set();

let explosions=[];

let particles=[];


/* =========================================================
   GROUND
========================================================= */

let groundBody=null;


function groundY(){

    return H-120;
}


function createGround(){

    if(groundBody){

        World.remove(
            world,
            groundBody
        );
    }

    groundBody =
        Bodies.rectangle(

            3000,

            groundY()+45,

            7000,

            90,

            {

                isStatic:true,

                friction:.9,

                restitution:.05,

                label:"GROUND"

            }
        );

    World.add(
        world,
        groundBody
    );
}


/* =========================================================
   BUILD PART CREATION
========================================================= */

function addBuildPart(
    type,
    x,
    y
){

    buildParts.push({

        id:
            Date.now()+
            Math.random(),

        type:type,

        x:x,

        y:y,

        angle:0
    });
}


/* =========================================================
   STARTER MACHINE
========================================================= */

function createStarterMachine(){

    buildParts=[];

    addBuildPart(
        "block",
        220,
        groundY()-100
    );

    addBuildPart(
        "wheel",
        185,
        groundY()-50
    );

    addBuildPart(
        "wheel",
        255,
        groundY()-50
    );

    addBuildPart(
        "rocket",
        280,
        groundY()-100
    );

    addBuildPart(
        "balloon",
        220,
        groundY()-175
    );
}


/* =========================================================
   CREATE PHYSICS BODY
========================================================= */

function createPhysicsBody(
    part
){

    const data =
        PARTS[part.type];

    let body;


    if(data.radius){

        body =
            Bodies.circle(

                part.x,

                part.y,

                data.radius,

                {

                    density:
                        data.density,

                    friction:.75,

                    frictionAir:.008,

                    restitution:.12,

                    label:
                        "PART_"+part.type

                }
            );

    }else{

        body =
            Bodies.rectangle(

                part.x,

                part.y,

                data.width,

                data.height,

                {

                    density:
                        data.density,

                    friction:.7,

                    frictionAir:.008,

                    restitution:.12,

                    label:
                        "PART_"+part.type

                }
            );
    }


    Body.setAngle(
        body,
        part.angle
    );


    body.partType =
        part.type;

    body.gamePart =
        part;

    return body;
}


/* =========================================================
   REBUILD WORLD
========================================================= */

function rebuildWorld(){

    Composite.clear(
        world,
        false
    );

    physicsBodies=[];

    constraints=[];

    createGround();


    if(running){

        for(
            const part
            of buildParts
        ){

            const body =
                createPhysicsBody(
                    part
                );

            physicsBodies.push(
                body
            );

            World.add(
                world,
                body
            );
        }

        connectParts();

        connectWheels();

    }else{

        for(
            const part
            of buildParts
        ){

            const body =
                createPhysicsBody(
                    part
                );

            body.isStatic=true;

            physicsBodies.push(
                body
            );

            World.add(
                world,
                body
            );
        }
    }

    worldReady=true;
}


/* =========================================================
   CONNECT PARTS
========================================================= */

const CONNECTION_DISTANCE=95;


function connectParts(){

    for(
        let i=0;
        i<physicsBodies.length;
        i++
    ){

        for(
            let j=i+1;
            j<physicsBodies.length;
            j++
        ){

            const a=
                physicsBodies[i];

            const b=
                physicsBodies[j];


            const dx=
                b.position.x-
                a.position.x;

            const dy=
                b.position.y-
                a.position.y;

            const distance=
                Math.hypot(
                    dx,
                    dy
                );


            if(
                distance<=
                CONNECTION_DISTANCE
            ){

                const joint =
                    Constraint.create({

                        bodyA:a,

                        bodyB:b,

                        length:
                            distance,

                        stiffness:.88,

                        damping:.08,

                        render:{
                            visible:false
                        }

                    });

                constraints.push(
                    joint
                );

                World.add(
                    world,
                    joint
                );
            }
        }
    }
}


/* =========================================================
   WHEEL CONNECTIONS
========================================================= */

function connectWheels(){

    for(
        const wheel
        of physicsBodies
    ){

        if(
            wheel.partType!=="wheel"
        ){
            continue;
        }


        let closest=null;

        let closestDistance=
            Infinity;


        for(
            const other
            of physicsBodies
        ){

            if(
                other===wheel ||
                other.partType==="wheel"
            ){
                continue;
            }


            const dx=
                other.position.x-
                wheel.position.x;

            const dy=
                other.position.y-
                wheel.position.y;

            const d=
                Math.hypot(
                    dx,
                    dy
                );


            if(
                d<closestDistance &&
                d<85
            ){

                closestDistance=d;

                closest=other;
            }
        }


        if(closest){

            const axle =
                Constraint.create({

                    bodyA:wheel,

                    bodyB:closest,

                    length:
                        closestDistance,

                    stiffness:1,

                    damping:.15,

                    render:{
                        visible:false
                    }

                });

            constraints.push(
                axle
            );

            World.add(
                world,
                axle
            );
        }
    }
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    if(
        buildParts.length===0
    ){

        showPopup(

            "NO INVENTION",

            "Add some parts before starting."

        );

        return;
    }


    running=true;

    elapsed=0;

    cameraX=0;

    rebuildWorld();


    document
        .getElementById("start")
        .textContent=
        "⏹ STOP";


    const mode=
        document.getElementById("mode");

    mode.textContent=
        "RUNNING";

    mode.className=
        "running";
}


/* =========================================================
   STOP GAME
========================================================= */

function stopGame(){

    running=false;

    rebuildWorld();


    document
        .getElementById("start")
        .textContent=
        "▶ START";


    const mode=
        document.getElementById("mode");

    mode.textContent=
        "BUILD MODE";

    mode.className=
        "build";
}


/* =========================================================
   ROCKETS
========================================================= */

function updateRockets(){

    for(
        const body
        of physicsBodies
    ){

        if(
            body.partType!=="rocket"
        ){
            continue;
        }


        /*
            The front of the rocket
            is the RIGHT side of
            rocket.png.

            If your artwork points
            left, change x:1 to x:-1.
        */

        const direction=
            Vector.rotate(

                {
                    x:1,
                    y:0
                },

                body.angle

            );


        const force=.001;


        Body.applyForce(

            body,

            body.position,

            {

                x:
                    direction.x*
                    force,

                y:
                    direction.y*
                    force

            }

        );


        if(
            Math.random()<.45
        ){

            createParticle(

                body.position.x-
                    direction.x*28,

                body.position.y-
                    direction.y*28,

                "#ff9b00"

            );
        }
    }
}


/* =========================================================
   BALLOONS
========================================================= */

function updateBalloons(){

    for(
        const body
        of physicsBodies
    ){

        if(
            body.partType!=="balloon"
        ){
            continue;
        }


        Body.applyForce(

            body,

            body.position,

            {

                x:0,

                y:-.00135

            }

        );
    }
}


/* =========================================================
   FANS
========================================================= */

function updateFans(){

    for(
        const body
        of physicsBodies
    ){

        if(
            body.partType!=="fan"
        ){
            continue;
        }


        body.fanRotation =
            (body.fanRotation||0)
            +.3;


        const direction=
            Vector.rotate(

                {
                    x:0,
                    y:-1
                },

                body.angle

            );


        Body.applyForce(

            body,

            body.position,

            {

                x:
                    direction.x*
                    .0003,

                y:
                    direction.y*
                    .0003

            }

        );
    }
}


/* =========================================================
   SPRINGS
========================================================= */

function updateSprings(){

    for(
        const body
        of physicsBodies
    ){

        if(
            body.partType!=="spring"
        ){
            continue;
        }


        const direction=
            Vector.rotate(

                {
                    x:0,
                    y:-1
                },

                body.angle

            );


        Body.applyForce(

            body,

            body.position,

            {

                x:
                    direction.x*
                    .00015,

                y:
                    direction.y*
                    .00015

            }

        );
    }
}


/* =========================================================
   MAGNETS
========================================================= */

function updateMagnets(){

    for(
        const magnet
        of physicsBodies
    ){

        if(
            magnet.partType!=="magnet"
        ){
            continue;
        }


        for(
            const other
            of physicsBodies
        ){

            if(
                other===magnet ||
                other.isStatic
            ){
                continue;
            }


            const dx=
                magnet.position.x-
                other.position.x;

            const dy=
                magnet.position.y-
                other.position.y;


            const distance=
                Math.hypot(
                    dx,
                    dy
                );


            if(
                distance>0 &&
                distance<220
            ){

                const force=
                    .0000009*
                    (
                        1-
                        distance/220
                    );


                Body.applyForce(

                    other,

                    other.position,

                    {

                        x:
                            dx/
                            distance*
                            force,

                        y:
                            dy/
                            distance*
                            force

                    }

                );
            }
        }
    }
}


/* =========================================================
   BOMBS
========================================================= */

function updateBombs(){

    for(
        const bomb
        of physicsBodies
    ){

        if(
            bomb.partType!=="bomb"
        ){
            continue;
        }


        if(
            explodedBombs.has(
                bomb.id
            )
        ){
            continue;
        }


        if(
            elapsed>=7000
        ){

            explodeBomb(
                bomb
            );
        }
    }
}


/* =========================================================
   EXPLODE BOMB
========================================================= */

function explodeBomb(
    bomb
){

    if(
        explodedBombs.has(
            bomb.id
        )
    ){
        return;
    }


    explodedBombs.add(
        bomb.id
    );


    const radius=230;


    for(
        const body
        of physicsBodies
    ){

        if(
            body===bomb ||
            body.isStatic
        ){
            continue;
        }


        const dx=
            body.position.x-
            bomb.position.x;

        const dy=
            body.position.y-
            bomb.position.y;


        const distance=
            Math.hypot(
                dx,
                dy
            );


        if(
            distance>0 &&
            distance<radius
        ){

            const force=
                .003*
                (
                    1-
                    distance/radius
                );


            Body.applyForce(

                body,

                body.position,

                {

                    x:
                        dx/
                        distance*
                        force,

                    y:
                        dy/
                        distance*
                        force

                }

            );


            Body.setAngularVelocity(

                body,

                body.angularVelocity+
                (Math.random()-.5)
                *.8

            );
        }
    }


    createExplosion(

        bomb.position.x,

        bomb.position.y

    );


    World.remove(
        world,
        bomb
    );


    physicsBodies=
        physicsBodies.filter(
            body=>
                body!==bomb
        );
}


/* =========================================================
   PARTICLES
========================================================= */

function createParticle(
    x,
    y,
    color
){

    particles.push({

        x:x,

        y:y,

        vx:
            (Math.random()-.5)
            *2,

        vy:
            (Math.random()-.5)
            *2,

        life:1,

        color:color

    });
}


function updateParticles(){

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];


        p.x+=p.vx;

        p.y+=p.vy;

        p.life-=.04;


        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   EXPLOSIONS
========================================================= */

function createExplosion(
    x,
    y
){

    explosions.push({

        x:x,

        y:y,

        radius:15,

        life:1

    });
}


function updateExplosions(){

    for(
        let i=
            explosions.length-1;
        i>=0;
        i--
    ){

        const explosion=
            explosions[i];


        explosion.radius+=8;

        explosion.life-=.025;


        if(
            explosion.life<=0
        ){

            explosions.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    if(
        physicsBodies.length===0
    ){
        return;
    }


    let x=0;

    let count=0;


    for(
        const body
        of physicsBodies
    ){

        x+=
            body.position.x;

        count++;
    }


    if(count){

        x/=count;


        cameraX=
            Math.max(
                0,

                x-
                W*.35
            );
    }
}

/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    if(
        images.background
    ){

        const image=
            images.background;


        const pattern=
            ctx.createPattern(
                image,
                "repeat"
            );


        if(pattern){

            ctx.fillStyle=
                pattern;

            ctx.fillRect(
                cameraX,
                0,
                W+cameraX,
                H
            );

            return;
        }
    }


    ctx.fillStyle=
        "#18212b";

    ctx.fillRect(
        cameraX,
        0,
        W,
        H
    );


    /* grid */

    ctx.strokeStyle=
        "rgba(255,255,255,.035)";

    ctx.lineWidth=1;


    const startX=
        Math.floor(
            cameraX/50
        )*50;


    for(
        let x=startX;
        x<cameraX+W+100;
        x+=50
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }


    for(
        let y=0;
        y<H;
        y+=50
    ){

        ctx.beginPath();

        ctx.moveTo(
            cameraX,
            y
        );

        ctx.lineTo(
            cameraX+W,
            y
        );

        ctx.stroke();
    }
}


/* =========================================================
   DRAW GROUND
========================================================= */

function drawGround(){

    const y=
        groundY();


    ctx.fillStyle=
        "#303840";


    ctx.fillRect(

        cameraX,

        y,

        W+1000,

        H-y

    );


    ctx.strokeStyle=
        "#727c86";

    ctx.lineWidth=4;


    ctx.beginPath();

    ctx.moveTo(
        cameraX,
        y
    );

    ctx.lineTo(
        cameraX+W+1000,
        y
    );

    ctx.stroke();


    ctx.fillStyle=
        "#737d87";

    ctx.font=
        "11px Arial";


    for(
        let x=
            Math.floor(
                cameraX/100
            )*100;

        x<
            cameraX+
            W+
            500;

        x+=100
    ){

        ctx.fillText(

            Math.floor(x/100)
            +"m",

            x,

            y+22

        );
    }
}


/* =========================================================
   DRAW TARGET
========================================================= */

function drawTarget(){

    const image=
        images.target;


    if(!image)return;


    const y=
        groundY()-42;


    ctx.drawImage(

        image,

        targetX-38,

        y-38,

        76,

        76

    );


    ctx.fillStyle=
        "#fff";

    ctx.font=
        "bold 11px Arial";


    ctx.fillText(

        "TARGET",

        targetX-22,

        y+50

    );
}


/* =========================================================
   DRAW BUILD PART
========================================================= */

function drawBuildPart(
    part
){

    const data=
        PARTS[part.type];

    const image=
        images[data.image];


    if(!image)return;


    ctx.save();


    ctx.translate(
        part.x,
        part.y
    );


    ctx.rotate(
        part.angle
    );


    ctx.globalAlpha=.95;


    ctx.drawImage(

        image,

        -data.width/2,

        -data.height/2,

        data.width,

        data.height

    );


    ctx.restore();
}


/* =========================================================
   DRAW PHYSICS PART
========================================================= */

function drawPhysicsPart(
    body
){

    const data=
        PARTS[
            body.partType
        ];


    if(!data)return;


    const image=
        images[
            data.image
        ];


    if(!image)return;


    ctx.save();


    ctx.translate(

        body.position.x,

        body.position.y

    );


    ctx.rotate(
        body.angle
    );


    ctx.drawImage(

        image,

        -data.width/2,

        -data.height/2,

        data.width,

        data.height

    );


    /*
        Wheel rotation is naturally
        handled because the body itself
        rotates in Matter.js.
    */


    ctx.restore();
}


/* =========================================================
   DRAW CONNECTIONS
========================================================= */

function drawConnections(){

    if(!running)return;


    ctx.strokeStyle=
        "rgba(255,255,255,.16)";

    ctx.lineWidth=2;


    for(
        const joint
        of constraints
    ){

        if(
            !joint.bodyA ||
            !joint.bodyB
        ){
            continue;
        }


        const a=
            joint.bodyA.position;

        const b=
            joint.bodyB.position;


        ctx.beginPath();


        ctx.moveTo(
            a.x,
            a.y
        );


        ctx.lineTo(
            b.x,
            b.y
        );


        ctx.stroke();
    }
}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

    for(
        const p
        of particles
    ){

        ctx.globalAlpha=
            p.life;

        ctx.fillStyle=
            p.color;


        ctx.beginPath();

        ctx.arc(

            p.x,

            p.y,

            3.5,

            0,

            Math.PI*2

        );

        ctx.fill();
    }


    ctx.globalAlpha=1;
}


/* =========================================================
   DRAW EXPLOSIONS
========================================================= */

function drawExplosions(){

    for(
        const e
        of explosions
    ){

        ctx.globalAlpha=
            e.life;


        ctx.fillStyle=
            "#ff7600";


        ctx.beginPath();

        ctx.arc(

            e.x,

            e.y,

            e.radius,

            0,

            Math.PI*2

        );

        ctx.fill();


        ctx.fillStyle=
            "#ffe06b";


        ctx.beginPath();

        ctx.arc(

            e.x,

            e.y,

            e.radius*.5,

            0,

            Math.PI*2

        );

        ctx.fill();
    }


    ctx.globalAlpha=1;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();


    ctx.save();


    ctx.translate(
        -cameraX,
        0
    );


    drawGround();

    drawTarget();


    if(running){

        drawConnections();


        for(
            const body
            of physicsBodies
        ){

            drawPhysicsPart(
                body
            );
        }

    }else{

        for(
            const part
            of buildParts
        ){

            drawBuildPart(
                part
            );
        }
    }


    drawParticles();

    drawExplosions();


    ctx.restore();


    requestAnimationFrame(
        render
    );
}


/* =========================================================
   BUILD INPUT
========================================================= */

let selectedPart=null;

let pointer={

    x:0,

    y:0,

    down:false
};


function updatePointer(e){

    const rect=
        canvas.getBoundingClientRect();


    const source=
        e.touches
        ? e.touches[0]
        : e;


    pointer.x=
        source.clientX-
        rect.left;


    pointer.y=
        source.clientY-
        rect.top;
}


function findPart(
    x,
    y
){

    for(
        let i=
            buildParts.length-1;

        i>=0;

        i--
    ){

        const part=
            buildParts[i];

        const data=
            PARTS[part.type];


        if(

            Math.abs(
                x-part.x
            )<
            data.width/2

            &&

            Math.abs(
                y-part.y
            )<
            data.height/2

        ){

            return part;
        }
    }


    return null;
}


/* =========================================================
   MOUSE
========================================================= */

canvas.addEventListener(
    "mousedown",
    e=>{

        if(running)return;


        updatePointer(e);

        pointer.down=true;


        selectedPart=
            findPart(

                pointer.x+
                cameraX,

                pointer.y

            );
    }
);


canvas.addEventListener(
    "mousemove",
    e=>{

        if(!selectedPart)return;

        if(running)return;


        updatePointer(e);


        selectedPart.x=
            pointer.x+
            cameraX;


        selectedPart.y=
            pointer.y;
    }
);


canvas.addEventListener(
    "mouseup",
    ()=>{

        pointer.down=false;

        selectedPart=null;
    }
);


/* =========================================================
   TOUCH
========================================================= */

canvas.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        if(running)return;


        updatePointer(e);

        pointer.down=true;


        selectedPart=
            findPart(

                pointer.x+
                cameraX,

                pointer.y

            );
    },
    {passive:false}
);


canvas.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();


        if(
            !selectedPart ||
            running
        ){
            return;
        }


        updatePointer(e);


        selectedPart.x=
            pointer.x+
            cameraX;


        selectedPart.y=
            pointer.y;
    },
    {passive:false}
);


canvas.addEventListener(
    "touchend",
    ()=>{

        pointer.down=false;

        selectedPart=null;
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

addEventListener(
    "keydown",
    e=>{

        if(
            e.code==="Space"
        ){

            e.preventDefault();


            if(running){

                stopGame();

            }else{

                startGame();
            }
        }


        if(
            e.code==="KeyR" &&
            selectedPart &&
            !running
        ){

            selectedPart.angle+=
                Math.PI/2;
        }


        if(
            e.code==="Delete" &&
            selectedPart &&
            !running
        ){

            buildParts=
                buildParts.filter(
                    p=>
                        p!==selectedPart
                );


            selectedPart=null;


            rebuildWorld();
        }
    }
);


/* =========================================================
   COLLISION EVENTS
========================================================= */

Events.on(

    engine,

    "collisionStart",

    event=>{

        if(!running)return;


        for(
            const pair
            of event.pairs
        ){

            const a=
                pair.bodyA;

            const b=
                pair.bodyB;


            if(
                a.partType==="bomb"
            ){

                if(
                    a.speed>8
                ){

                    explodeBomb(a);
                }
            }


            if(
                b.partType==="bomb"
            ){

                if(
                    b.speed>8
                ){

                    explodeBomb(b);
                }
            }
        }
    }
);

/* =========================================================
   PART MENU
========================================================= */

const partsTray=
    document.getElementById(
        "partsTray"
    );


function buildPartMenu(){

    partsTray.innerHTML="";


    for(
        const id in PARTS
    ){

        const data=
            PARTS[id];


        const unlocked=
            save.unlocked.includes(
                id
            );


        const button=
            document.createElement(
                "div"
            );


        button.className=
            "partButton";


        if(!unlocked){

            button.classList.add(
                "locked"
            );
        }


        button.innerHTML=`

            <img
                src="images/${id}.png"
                alt="${data.name}"
            >

            <div class="partName">
                ${
                    unlocked
                    ? data.name
                    : "LOCKED"
                }
            </div>

            ${
                unlocked
                ? ""
                : `
                    <div class="partCost">
                        ${data.cost} 🪙
                    </div>
                  `
            }

        `;


        button.onclick=()=>{

            if(!unlocked){

                buyPart(id);

                return;
            }


            if(running)return;


            /*
                Add part beside the
                last part so it is easy
                to begin connecting things.
            */

            let x=220;

            let y=
                groundY()-150;


            if(
                buildParts.length>0
            ){

                const last=
                    buildParts[
                        buildParts.length-1
                    ];


                x=
                    last.x+
                    75;


                y=
                    last.y;
            }


            addBuildPart(
                id,
                x,
                y
            );


            rebuildWorld();
        };


        partsTray.appendChild(
            button
        );
    }
}


/* =========================================================
   BUY PART
========================================================= */

function buyPart(id){

    const data=
        PARTS[id];


    if(
        save.coins<
        data.cost
    ){

        showPopup(

            "NOT ENOUGH COINS",

            `
            You need
            <b style="color:#ffd43b">
                ${data.cost} coins
            </b>
            to unlock
            ${data.name}.
            `
        );

        return;
    }


    save.coins-=
        data.cost;


    save.unlocked.push(
        id
    );


    saveGame();

    updateCoins();

    buildPartMenu();
}

/* =========================================================
   MAIN GAME LOOP
========================================================= */

let lastTime=
    performance.now();


function gameLoop(
    currentTime
){

    const delta=
        Math.min(
            currentTime-
            lastTime,

            33
        );


    lastTime=
        currentTime;


    if(running){

        elapsed+=delta;


        updateRockets();

        updateBalloons();

        updateFans();

        updateSprings();

        updateMagnets();

        updateBombs();


        Engine.update(
            engine,
            delta
        );


        updateCamera();

        checkGoal();

        checkDeath();
    }


    updateParticles();

    updateExplosions();


    requestAnimationFrame(
        gameLoop
    );
}


requestAnimationFrame(
    gameLoop
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        resizeCanvas();

        if(!running){

            rebuildWorld();
        }
    }
);

</script>
